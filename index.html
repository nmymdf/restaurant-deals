<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'%3E%3Crect width='108' height='108' rx='24' fill='%231F1B16'/%3E%3Cpath d='M40 26L66 54M49 22L75 50' stroke='%23F1DD8A' stroke-width='3.2' stroke-linecap='round'/%3E%3Cpath d='M26 54H82A28 28 0 0 1 26 54Z' fill='%23C9A227'/%3E%3Crect x='42' y='80' width='24' height='5' rx='2.5' fill='%23C9A227'/%3E%3Cpath d='M34 64H74' stroke='%231F1B16' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--pg:#F7F4EC;--cd:#fff;--tx:#1F1B16;--sb:#6B6558;--ln:#E8E2D2;--ch:#EFE9D6;--rd:#B3261E;--rdbg:#FBE9E7;--hi:#A8860F;--gold:#C9A227;--ink:#1F1B16;--vg:#2F6B33;--vgbg:#E3F0E2}
@media(prefers-color-scheme:dark){:root{--pg:#14120F;--cd:#1F1B16;--tx:#F2EEE4;--sb:#A59E8C;--ln:#332E25;--ch:#2A2519;--rd:#FF8A80;--rdbg:#3A1F1C;--hi:#C9A227;--vg:#8FD19A;--vgbg:#1E2E20}}
*{box-sizing:border-box}
html{background:var(--pg)}
body{margin:0;background:var(--pg);color:var(--tx);font:15px/1.5 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 28px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#splash{position:fixed;inset:0;z-index:100;background:#000 url(splash.jpg) center/cover no-repeat;transition:opacity .35s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .ver{position:absolute;left:0;right:0;bottom:5%;text-align:center;font-size:13px;font-style:italic;letter-spacing:2px;color:#C9A227}
.head{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:10px;flex:none}
.ttl{flex:1;min-width:0}
h1{font-size:19px;line-height:1.25;margin:0;font-weight:700}
.credit{font-size:12px;font-style:italic;color:var(--gold)}
.refresh{font-size:24px;color:var(--sb);padding:2px 6px;line-height:1}
#info{font-size:12px;color:var(--sb);margin:8px 0 10px}
.nb{display:flex;align-items:center;width:100%;text-align:left;background:var(--cd);border:1px solid var(--gold);border-radius:14px;padding:11px 14px;margin-bottom:10px}
.nb .t{font-size:15px;font-weight:700}
.nb .s{font-size:12px;color:var(--sb)}
.nb i{font-style:normal;font-size:22px;color:var(--hi);margin-left:auto}
.frow{display:flex;gap:8px}
.fbtn{display:flex;align-items:center;justify-content:space-between;min-width:0;background:var(--cd);border:.5px solid var(--ln);border-radius:12px;padding:10px 12px 10px 14px;font-size:13px;text-align:left}
.fbtn.reg{flex:1.25}.fbtn.cat{flex:1}
.fbtn.open{border:1px solid var(--gold)}
.fbtn .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbtn span.k{color:var(--sb)}
.fbtn i{font-style:normal;color:var(--sb);margin-left:6px}
#regpanel,#catpanel{display:none;background:var(--cd);border:.5px solid var(--ln);border-radius:14px;margin-top:4px}
#catpanel{padding:8px;max-height:56vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.cg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.cc{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--ln);background:var(--pg);border-radius:10px;padding:13px 12px;font-size:15px;text-align:left;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cc b{font-weight:400;font-size:13px;color:var(--sb)}
.cc.on{background:var(--ch);border-color:var(--gold);color:var(--hi);font-weight:700}
.cc.veg{background:var(--vgbg);border-color:var(--vg);color:var(--vg);font-weight:700}.cc.veg b{color:var(--vg)}
.cc.zero{background:transparent;border-style:dashed;color:var(--sb)}
.cc.drag{opacity:.35}
.cc.over{outline:2px solid var(--gold)}
.cgall{display:block;width:100%;text-align:center;padding:12px;border-radius:10px;background:var(--ch);color:var(--hi);font-weight:700;font-size:15px;margin-bottom:6px;border:1px solid transparent}
.cgall.on{border-color:var(--gold)}
.cghint{display:block;width:100%;text-align:center;font-size:12px;color:var(--hi);padding:10px 0 4px}
#ghost{position:fixed;z-index:200;pointer-events:none;opacity:.9;box-shadow:0 6px 18px #0006;display:none}
.rbody{display:flex;height:300px}
.rl{flex:.85;overflow-y:auto;background:var(--pg);border-radius:14px 0 0 0}
.rr{flex:1.15;overflow-y:auto}
.glab{font-size:11px;color:var(--sb);padding:10px 14px 4px}
.crow{display:flex;align-items:center;width:100%;text-align:left;font-size:14px;color:var(--sb);padding:0}
.crow b{width:3px;height:24px;background:transparent;flex:none}
.crow span{padding:11px 8px 11px 11px}
.crow.on{background:var(--cd);color:var(--tx);font-weight:700}
.crow.on b{background:var(--gold)}
.orow{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;font-size:14px;padding:11px 14px;border-top:.5px solid var(--ln)}
.orow:first-child{border-top:0}
.orow.on{color:var(--hi);font-weight:700}
.rhint{color:var(--sb);font-size:13px;line-height:1.6;padding:16px}
.rfoot{display:flex;gap:8px;padding:10px 12px;border-top:.5px solid var(--ln)}
.rfoot button{border-radius:12px;padding:11px 0;font-size:14px;border:.5px solid var(--ln);background:var(--cd)}
.rfoot .c{flex:1}
.rfoot .a{flex:2;background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700}
.note{font-size:12px;color:var(--sb);background:var(--ch);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.pk .why{font-size:12.5px;margin-top:4px}
.dist{font-size:12px;font-weight:700;color:var(--hi);flex:none}
.more{display:block;width:100%;margin-top:6px;background:var(--gold);color:var(--ink);font-weight:700;border-radius:12px;padding:11px 0;font-size:14px}
.tabs{display:flex;gap:20px;margin:10px 4px 8px}
.tab{font-size:13px;color:var(--sb);padding:4px 0 3px;border-bottom:2px solid transparent}
.tab.on{color:var(--tx);font-weight:700;border-bottom-color:var(--gold)}
.card{display:block;background:var(--cd);border:.5px solid var(--ln);border-radius:14px;padding:12px 14px;margin-bottom:10px;color:inherit;cursor:pointer}
.card:hover,.card:focus{border-color:var(--gold);outline:0}
.r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-size:15px;font-weight:700}
.badge{font-size:11px;padding:2px 8px;border-radius:9px;background:var(--ch);color:var(--sb);flex:none}
.badge.hot{background:var(--rdbg);color:var(--rd)}
.offer{font-size:13px;line-height:1.55;margin:6px 0 8px}
.offer b{color:var(--hi);font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag.veg{background:var(--vgbg);color:var(--vg)}
.tier{font-size:12px;font-weight:700;color:var(--sb);margin:6px 2px}
.tier.t1{color:var(--hi)}
.vegbtn{font-size:13px;padding:7px 14px;border-radius:16px;background:var(--ch);color:var(--sb);margin-bottom:12px}
.vegbtn.on{background:var(--vgbg);color:var(--vg);box-shadow:inset 0 0 0 1px var(--vg)}
.tag{font-size:11px;padding:2px 8px;border-radius:9px;background:var(--ch);color:var(--sb)}
.until{margin-left:auto;font-size:12px;color:var(--sb)}
.empty{text-align:center;color:var(--sb);font-size:14px;padding:48px 16px}
.hint{text-align:center;color:var(--sb);font-size:12px;padding:8px}
#detail,#nearby{position:fixed;inset:0;z-index:40;background:var(--pg);overflow-y:auto;display:none}
#detail{z-index:45}
#detail .wrap,#nearby .wrap{padding-bottom:40px}
.bar{display:flex;align-items:center;justify-content:space-between}
.back{font-size:26px;line-height:1;padding:2px 14px 2px 0}
.dtitle{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 8px}
.dtitle h2{font-size:22px;margin:0;font-weight:700;line-height:1.3}
.dtags{display:flex;flex-wrap:wrap;gap:6px}
.box{background:var(--cd);border:.5px solid var(--ln);border-radius:14px;padding:12px 14px;margin-top:12px}
.box .lb{font-size:11px;color:var(--sb)}
.box .big{font-size:15px;line-height:1.6;margin-top:4px}
.box .big b{color:var(--hi);font-weight:700}
.info{padding:2px 14px;margin-top:10px}
.irow{display:block;width:100%;text-align:left;padding:10px 0;border-bottom:.5px solid var(--ln)}
.irow:last-child{border-bottom:0}
.irow .lb{font-size:11px;color:var(--sb)}
.irow .v{font-size:14px;margin-top:2px}
.irow.tap .v{color:var(--hi);font-weight:700}
.btns{display:flex;gap:8px;margin-top:14px}
.btns a,.btns button{flex:1;text-align:center;text-decoration:none;color:var(--tx);background:var(--cd);border:.5px solid var(--ln);border-radius:12px;padding:11px 0;font-size:14px}
.btns .g{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700}
#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet .bk{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--cd);border-radius:18px 18px 0 0;padding:10px 10px 18px}
#sheet .pn .t{font-size:12px;color:var(--sb);text-align:center;padding:4px 0 8px}
#sheet .pn a,#sheet .pn button{display:block;width:100%;text-align:center;text-decoration:none;color:var(--tx);padding:13px 0;font-size:15px;border-top:.5px solid var(--ln)}
#toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:#1F1B16;color:#F2EEE4;font-size:13px;padding:8px 16px;border-radius:18px;z-index:90;display:none}
#a2hs{position:fixed;inset:0;z-index:95;display:none}
#a2hs .bk{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#a2hs .pn{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--cd);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
#a2hs h3{margin:0;font-size:19px}
#a2hs .st{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:.5px solid var(--ln);font-size:17px;line-height:1.5}
#a2hs .n{flex:none;width:30px;height:30px;border-radius:15px;background:var(--gold);color:var(--ink);font-weight:700;text-align:center;line-height:30px}
#a2hs .go{display:block;width:100%;background:var(--gold);color:var(--ink);font-weight:700;border-radius:12px;padding:13px 0;font-size:17px;margin-top:8px;text-align:center}
#a2hs .no{display:block;width:100%;color:var(--sb);font-size:14px;padding:12px 0 0;text-align:center}
#a2hs .ar{text-align:center;color:var(--hi);font-size:14px;padding-top:8px}
</style>
</head>
<body>
<div id="splash"><div class="ver">v0.9</div></div>
<div class="wrap" id="main">
<div class="head">
<svg class="logo" viewBox="0 0 108 108" aria-hidden="true"><rect width="108" height="108" fill="#1F1B16"/><path d="M40 26L66 54M49 22L75 50" stroke="#F1DD8A" stroke-width="3.2" stroke-linecap="round"/><path d="M26 54H82A28 28 0 0 1 26 54Z" fill="#C9A227"/><rect x="42" y="80" width="24" height="5" rx="2.5" fill="#C9A227"/><path d="M34 64H74" stroke="#1F1B16" stroke-width="2.4" stroke-linecap="round"/></svg>
<div class="ttl"><h1>餐廳優惠日報</h1><div class="credit">作者：ArchieKUO　v0.9</div></div>
<button class="refresh" id="refresh" aria-label="重新整理">↻</button>
</div>
<div id="info"></div>
<button class="nb" id="nbbtn"><div><div class="t">附近好餐廳</div><div class="s">你所在位置 2 公里內，評價高或人氣旺的店</div></div><i>›</i></button>
<div class="frow"><button class="fbtn reg" id="regbtn"></button><button class="fbtn cat" id="catbtn"></button></div>
<div id="regpanel"><div class="rbody"><div class="rl" id="rl"></div><div class="rr" id="rr"></div></div><div class="rfoot"><button class="c" id="rclear">清除</button><button class="a" id="rapply"></button></div></div>
<div id="catpanel"></div>
<div class="tabs" id="tabs"></div>
<div id="list"></div>
</div>
<div id="nearby"><div class="wrap" id="nwrap"></div></div>
<div id="detail"><div class="wrap" id="dwrap"></div></div>
<div id="sheet"><div class="bk" id="sheetbk"></div><div class="pn" id="sheetpn"></div></div>
<div id="a2hs"><div class="bk" id="a2bk"></div><div class="pn" id="a2pn"></div></div>
<div id="ghost" class="cc"></div>
<div id="toast"></div>
<script>
var VER="v0.9";
var GROUPS=[];
var HI=/[0-9,]+\s*元|[0-9.]+\s*折|[一二三四五六七八九十]+折|買[一二1]送[一二1]|[四五六七八九十]人同行[一二]人免費|免費|半價/g;
var ALL="全部類別";
var state={region:"全台",districts:[],pendCity:"全台",pendDs:[],category:ALL,panel:0,tab:"即將到期",deals:[],updated:""};
try{var s0=JSON.parse(localStorage.getItem("deals-ui")||"{}");if(s0.tab)state.tab=s0.tab}catch(e){}
function save(){try{localStorage.setItem("deals-ui",JSON.stringify({tab:state.tab}))}catch(e){}}
function normCity(r){
  r=(r||"").trim().replace(/臺/g,"台");if(!r||r=="全台")return "全台";
  for(var i=0;i<GROUPS.length;i++)for(var j=0;j<GROUPS[i].cities.length;j++){var c=GROUPS[i].cities[j];if(c.name==r||c.key==r)return c.name}
  return r;
}
function districtsOf(city){for(var i=0;i<GROUPS.length;i++)for(var j=0;j<GROUPS[i].cities.length;j++)if(GROUPS[i].cities[j].name==city)return GROUPS[i].cities[j].districts;return []}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function parse(s){var p=(s||"").split("-");return p.length==3?new Date(+p[0],+p[1]-1,+p[2]):null}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function hl(box,text){
  var last=0,m;HI.lastIndex=0;
  while((m=HI.exec(text))){
    if(m.index>last)box.appendChild(document.createTextNode(text.slice(last,m.index)));
    box.appendChild(el("b",null,m[0]));last=m.index+m[0].length;
    if(m[0].length==0)HI.lastIndex++;
  }
  if(last<text.length)box.appendChild(document.createTextNode(text.slice(last)));
}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(toast._t);toast._t=setTimeout(function(){e.style.display="none"},1800)}
function live(){var t=today();return state.deals.filter(function(d){return d._until&&d._until>=t})}
var PRESET=["自助餐","牛排西餐","燒肉","火鍋","日式料理","中式港式","台菜","小吃麵食","韓式料理","泰式東南亞","義式法式","居酒屋燒烤","海鮮","速食","早午餐咖啡","飲料甜點","麵包烘焙","飯店餐廳","鐵板燒","便當","親子餐廳","餐酒館"];
var VEG=["素食","全素","蛋奶素"];
function isVeg(tags){return (tags||[]).some(function(x){return VEG.indexOf(x)>=0})}
function catCounts(){var c={};live().forEach(function(d){c[d.category]=(c[d.category]||0)+1});c["素食"]=live().filter(function(d){return isVeg(d.tags)}).length;return c}
function categories(){
  var c=catCounts();
  var extra=Object.keys(c).filter(function(k){return k!="素食"&&PRESET.indexOf(k)<0&&k!="其他"}).sort(function(a,b){return (c[b]||0)-(c[a]||0)});
  var base=["素食"].concat(PRESET,extra);
  if(state.category!=ALL&&base.indexOf(state.category)<0&&state.category!="其他")base.push(state.category);
  base.push("其他");
  var saved=[];try{saved=JSON.parse(localStorage.getItem("deals-catorder")||"[]")}catch(e){}
  saved=saved.filter(function(n,i){return base.indexOf(n)>=0&&saved.indexOf(n)==i});
  return saved.concat(base.filter(function(n){return saved.indexOf(n)<0}));
}
function saveOrder(l){try{if(l)localStorage.setItem("deals-catorder",JSON.stringify(l));else localStorage.removeItem("deals-catorder")}catch(e){}}
function moveCat(from,to){
  if(from==to)return;var l=categories();l.splice(l.indexOf(from),1);var i=l.indexOf(to);l.splice(i<0?l.length:i,0,from);saveOrder(l);render();
}
function buildCats(cp){
  var cc=catCounts();
  var al=el("button","cgall"+(state.category==ALL?" on":""),state.category==ALL?ALL+" ✓":ALL);
  al.onclick=function(e){e.stopPropagation();state.category=ALL;state.panel=0;render()};cp.appendChild(al);
  var g=el("div","cg");cp.appendChild(g);
  categories().forEach(function(n){
    var k=cc[n]||0;
    var b=el("div","cc"+(n=="素食"?" veg":"")+(n==state.category?" on":"")+(!k&&n!="素食"?" zero":""));
    b.dataset.n=n;b.appendChild(el("span",null,n==state.category?n+" ✓":n));b.appendChild(el("b",null,String(k)));
    attachDrag(b,n);g.appendChild(b);
  });
  var h=el("button","cghint","長按卡片可以拖動排序　·　恢復預設順序");
  h.onclick=function(e){e.stopPropagation();saveOrder(null);render()};cp.appendChild(h);
}
function attachDrag(b,n){
  var timer=null,dragging=false,sx=0,sy=0,over=null,moved=false;
  var ghost=document.getElementById("ghost");
  function stopTimer(){clearTimeout(timer);timer=null}
  function overEl(x,y){var e=document.elementFromPoint(x,y);return e&&e.closest?e.closest(".cc"):null}
  b.addEventListener("pointerdown",function(e){
    sx=e.clientX;sy=e.clientY;moved=false;
    timer=setTimeout(function(){
      dragging=true;b.classList.add("drag");
      ghost.textContent=n;ghost.style.width=b.offsetWidth+"px";ghost.style.display="flex";
      ghost.style.left=(sx-b.offsetWidth/2)+"px";ghost.style.top=(sy-24)+"px";
      try{b.setPointerCapture(e.pointerId)}catch(x){}
      if(navigator.vibrate)try{navigator.vibrate(15)}catch(x){}
    },450);
  });
  b.addEventListener("pointermove",function(e){
    if(!dragging){if(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8){moved=true;stopTimer()}return}
    ghost.style.left=(e.clientX-b.offsetWidth/2)+"px";ghost.style.top=(e.clientY-24)+"px";
    var t=overEl(e.clientX,e.clientY);
    if(over&&over!==t)over.classList.remove("over");
    over=(t&&t!==b)?t:null;if(over)over.classList.add("over");
  });
  function end(e,cancel){
    stopTimer();
    if(!dragging)return;
    dragging=false;ghost.style.display="none";b.classList.remove("drag");
    var t=over;over=null;
    document.querySelectorAll(".cc.over").forEach(function(x){x.classList.remove("over")});
    b.dataset.skip="1";setTimeout(function(){delete b.dataset.skip},50);
    if(!cancel&&t&&t.dataset.n)moveCat(n,t.dataset.n);
  }
  b.addEventListener("pointerup",function(e){end(e,false)});
  b.addEventListener("pointercancel",function(e){end(e,true)});
  b.addEventListener("touchmove",function(e){if(dragging)e.preventDefault()},{passive:false});
  b.addEventListener("contextmenu",function(e){e.preventDefault()});
  b.addEventListener("click",function(e){
    e.stopPropagation();
    if(b.dataset.skip||moved)return;
    state.category=n;state.panel=0;render();
  });
}
function filtered(city,ds){
  var l=live();
  if(city!="全台")l=l.filter(function(d){
    var dc=normCity(d.region);if(dc=="全台")return true;if(dc!=city)return false;
    var x=d.districts||[];if(!ds.length||!x.length)return true;
    return x.some(function(n){return ds.indexOf(n)>=0});
  });
  if(state.category=="素食")l=l.filter(function(d){return isVeg(d.tags)});

  var nav=el("button","g","導航");nav.onclick=function(){openSheet(d)};bs.appendChild(nav);
  var tel=el("button",null,"撥打");tel.onclick=function(){if(k.phone)location.href="tel:"+k.phone.replace(/[^0-9+]/g,"");else toast("沒有電話資料")};bs.appendChild(tel);
  var src=el("button",null,"資料來源");src.onclick=function(){if(k.url)window.open(k.url,"_blank","noopener");else toast("沒有來源網址")};bs.appendChild(src);
  w.appendChild(bs);
  var n=el("div","hint","評價與點閱數為整理當日的公開資料，可能與現況略有差異。");n.style.textAlign="left";n.style.marginTop="10px";w.appendChild(n);
  var dt=document.getElementById("detail");dt.style.display="block";dt.scrollTop=0;
  history.pushState({pick:1},"");
}
document.getElementById("nbbtn").onclick=openNearby;
function loadRegions(){
  fetch("regions.json").then(function(r){return r.json()}).then(function(j){GROUPS=j.groups||[];render()}).catch(function(){});
}
function load(manual){
  fetch("data.json?t="+Date.now()).then(function(r){return r.json()}).then(function(j){
    state.updated=j.updated||"";
    state.deals=(j.deals||[]).map(function(d){d._until=parse(d.until);d.category=d.category||"其他";return d});
    render();if(manual)toast("已更新");
  }).catch(function(){if(manual)toast("無法更新，請檢查網路")});
}
function a2hs(){
  var ua=navigator.userAgent,ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform=="MacIntel"&&navigator.maxTouchPoints>1);
  if(!ios||navigator.standalone||/CriOS|FxiOS|EdgiOS/.test(ua))return;
  try{if(localStorage.getItem("deals-a2hs")=="no")return}catch(e){}
  var pn=document.getElementById("a2pn");pn.textContent="";
  pn.appendChild(el("h3",null,"把它放到手機主畫面"));
  pn.appendChild(el("div","credit","作者：ArchieKUO　"+VER));
  [["點最下面的「分享」按鈕（方塊加向上箭頭）"],["往上滑，點「加入主畫面」"],["點右上角「加入」"]].forEach(function(t,i){
    var r=el("div","st");r.appendChild(el("span","n",String(i+1)));r.appendChild(el("span",null,t[0]));pn.appendChild(r)});
  var g=el("button","go","我知道了");g.onclick=function(){document.getElementById("a2hs").style.display="none"};pn.appendChild(g);
  var n=el("button","no","不再提醒");n.onclick=function(){try{localStorage.setItem("deals-a2hs","no")}catch(e){}document.getElementById("a2hs").style.display="none"};pn.appendChild(n);
  pn.appendChild(el("div","ar","▼ 分享鈕在畫面最下方"));
  document.getElementById("a2hs").style.display="block";
}
document.getElementById("a2bk").onclick=function(){document.getElementById("a2hs").style.display="none"};
document.getElementById("refresh").onclick=function(){load(true)};
render();loadRegions();load(false);
setTimeout(a2hs,1400);
setTimeout(function(){var s=document.getElementById("splash");s.className="out";setTimeout(function(){s.style.display="none"},400)},800);
</script>
