name: Build APK
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Bundle the latest data into the app
        run: |
          mkdir -p app/src/main/assets
          cp data.json app/src/main/assets/data.json
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Publish APK to the apk branch
        run: |
          mkdir out
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "out/Deals-v${VER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk out/Deals.apk
          cd out
          git init -b apk
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -m "Built APK"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
